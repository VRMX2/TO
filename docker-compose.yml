services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybergame-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
    volumes:
      - pip-cache:/root/.cache/pip
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: node:20-alpine
    container_name: cybergame-web
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_API_KEY=${VITE_API_KEY:-}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pip-cache:
  web-node-modules:
