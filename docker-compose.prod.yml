services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybergame-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_KEY: ${VITE_API_KEY:-}
    container_name: cybergame-web-prod
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge
