name: Docker Build Check

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-backend:
    name: Build Dev Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image (dev stack)
        run: docker compose -f docker-compose.yml build backend

  build-prod-stack:
    name: Build Prod Stack Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend + web images (prod stack)
        run: docker compose -f docker-compose.prod.yml build
